$engine: 3
$onesync: on
name: Qbox Zombie Apocalypse Server
version: 1.0.0
author: Custom
description: Base Qbox setup configured for custom Zombie Survival resources.

tasks:
  # 1. ดาวน์โหลดไฟล์พื้นฐานของ FiveM
  - action: download_github
    src: https://github.com
    ref: master
    subpath: resources
    dest: ./resources/[cfx-default]

  # 2. เชื่อมต่อฐานข้อมูล MySQL อัตโนมัติผ่าน txAdmin
  - action: connect_database

  # 3. ดาวน์โหลดและแตกไฟล์ Dependencies หลัก (Release ZIP ตัวเต็ม)
  - action: download_file
    url: https://github.com
    path: ./tmp/oxmysql.zip
  - action: unzip
    src: ./tmp/oxmysql.zip
    dest: ./resources/[standalone]

  - action: download_file
    url: https://github.com
    path: ./tmp/ox_lib.zip
  - action: unzip
    src: ./tmp/ox_lib.zip
    dest: ./resources/[ox]

  - action: download_file
    url: https://github.com
    path: ./tmp/ox_inventory.zip
  - action: unzip
    src: ./tmp/ox_inventory.zip
    dest: ./resources/[ox]

  # 4. ดาวน์โหลด Core และระบบหลักจาก GitHub (ลิงก์ Repo เต็ม)
  - action: download_github
    src: https://github.com
    ref: main
    dest: ./resources/[qbx]/qbx_core

  - action: download_github
    src: https://github.com
    ref: main
    dest: ./resources/[ox]/ox_target

  - action: download_github
    src: https://github.com
    ref: main
    dest: ./resources/[voice]/pma-voice

  - action: download_github
    src: https://github.com
    ref: main
    dest: ./resources/[standalone]/illenium-appearance

  # 5. ลบไฟล์ชั่วคราว .zip
  - action: remove_path
    path: ./tmp

  # 6. สร้างไฟล์ server.cfg พร้อมเรียงลำดับ Ensure สคริปต์ทั้งหมดตามภาพ
  - action: write_file
    file: ./server.cfg
    data: |
      # ==========================================
      # NETWORK & SERVER SETTINGS
      # ==========================================
      endpoint_add_tcp "0.0.0.0:30120"
      endpoint_add_udp "0.0.0.0:30120"
      sv_maxclients 48
      set steam_webApiKey "none"
      sv_licenseKey "{{svLicense}}"
      set mysql_connection_string "{{dbConnectionString}}"
      set mysql_slow_query_warning 200

      sv_hostname "Zombie Apocalypse Survival | Qbox"
      sets sv_projectName "Zombie Survival"
      sets sv_projectDesc "Qbox Zombie Apocalypse Server"
      sets locale "th-TH"
      sets tags "zombie, survival, qbox, apocalypse, roleplay"

      # Voice & OneSync Config
      setr voice_useNativeAudio true
      setr voice_useSendingRangeOnly true
      setr voice_defaultCycle "GRAVE"
      setr voice_defaultVolume 0.3
      setr voice_enableRadioAnim 1
      setr ox:primaryColor "red"
      setr ox:primaryShade 8

      # ==========================================
      # 1. CFX DEFAULT & CORE DEPENDENCIES
      # ==========================================
      ensure mapmanager
      ensure chat
      ensure spawnmanager
      ensure baseevents
      ensure cfxlua-require
      ensure oxmysql
      ensure ox_lib
      ensure qbx_core
      ensure ox_target
      ensure ox_inventory
      ensure pma-voice

      # ==========================================
      # 2. QBOX FRAMEWORK MODULES
      # ==========================================
      ensure qbx_adminmenu
      ensure qbx_ambulancejob
      ensure qbx_binoculars
      ensure qbx_chat_theme
      ensure qbx_management
      ensure qbx_medical
      ensure qbx_properties
      ensure qbx_scoreboard
      ensure qbx_scrapyard
      ensure qbx_seatbelt
      ensure qbx_smallresources
      ensure qbx_vehiclekeys
      ensure qbx_vehicles

      # ==========================================
      # 3. STANDALONE & UTILITIES
      # ==========================================
      ensure loadscreen
      ensure illenium-appearance
      ensure Renewed-Banking
      ensure ox_doorlock
      ensure ox_fuel
      ensure scully_emotemenu
      ensure screencapture
      ensure mm_radio
      ensure mana_audio
      ensure vehiclehandler

      # ==========================================
      # 4. MAPS & APOCALYPSE ENVIRONMENT
      # ==========================================
      ensure bob74_ipl
      ensure apoc_decor
      ensure apoc_ruins
      ensure apoc_ymap
      ensure greatwall
      ensure greatwall_ymap
      ensure observatory_hub
      ensure pillbox
      ensure ri_apoc_landmarks
      ensure ri_createmap
      ensure ri_downtown_ruins
      ensure ri_hawick_ruins
      ensure ri_maps
      ensure ri_outpost_base

      # ==========================================
      # 5. CLOTHING & CUSTOM VEHICLES
      # ==========================================
      ensure clothing_tactical_1
      ensure clothing_tactical_2
      ensure clothing_tactical_3
      ensure clothing_tactical_4
      ensure clothing_tactical_5
      ensure clothing_tactical_6
      ensure r4tf141
      ensure r4wagner

      # ==========================================
      # 6. ZOMBIE & SURVIVAL SYSTEMS (รันท้ายสุดเสมอ)
      # ==========================================
      ensure nonpc
      ensure zombase
      ensure special_safezones
      ensure ri_survival
      ensure ri_zombiepeds
      ensure ri_boss_nemesis
      ensure ri_zombie_gore
      ensure ri_blood_slime
      ensure ri_flamethrower
      ensure ri_bwsr2_weaponsounds
      ensure ri_anticheat

      # ==========================================
      # PERMISSIONS (txAdmin & Qbox Admin)
      # ==========================================
      add_ace group.admin command allow
      add_ace group.admin command.quit deny
      add_principal identifier.fivem:1 group.admin
